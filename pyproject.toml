[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salsa-jax"
version = "0.1.0.dev0"
description = "Incremental, Fortran-validated JAX kernels for HAM-SALSA"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.35", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

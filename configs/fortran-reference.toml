# The initial compatibility build preserves the upstream numerical flags.
# NetCDF include/link paths are discovered through nf-config and nc-config.
[build]
compiler = "gfortran"
flags = ["-cpp", "-g", "-fbacktrace", "-std=legacy", "-ffpe-trap=invalid,zero,overflow", "-O", "-DNOMPI", "-DSALSA", "-D__x86_64", "-I./include"]
jobs = 1
timeout_seconds = 180

[run]
timeout_seconds = 60
